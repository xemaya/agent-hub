<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Agent Hub · 中央工作台</title>
  <link rel="stylesheet" href="/style.css?v=8">
</head>
<body>
  <section id="auth-view" class="auth-shell">
    <div class="auth-manifest">
      <div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <h1>AGENT<br>HUB</h1>
    </div>
    <form id="auth-form" class="auth-form">
      <h2>连接中控</h2>
      <label for="admin-token">Admin Token</label>
      <input id="admin-token" name="token" type="password" autocomplete="current-password" required autofocus>
      <button class="button button-primary" type="submit">连接</button>
      <p id="auth-error" class="form-error" role="alert"></p>
      <p class="security-note">凭证仅保存在当前标签页的 sessionStorage。</p>
    </form>
  </section>

  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark small" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <strong>AGENT HUB</strong>
      </div>
      <div class="topbar-actions">
        <span id="connection" class="connection offline"><i></i>未连接</span>
        <button id="refresh" class="button button-ghost" type="button">刷新</button>
        <button id="logout" class="button button-ghost" type="button">断开</button>
      </div>
    </header>

    <div class="workspace">
      <nav class="workspace-nav" aria-label="工作台视图">
        <button class="active" type="button" data-view="operations" aria-pressed="true">操作台</button>
        <button type="button" data-view="tasks" aria-pressed="false">任务看板 <b data-count="tasks">0</b></button>
      </nav>

      <section id="view-operations" aria-label="操作台">
        <div class="workbench-grid">
          <main id="main" class="conversation-panel" aria-label="与中央大脑对话">
            <div id="coordinator-status" class="coordinator-status"></div>
            <div id="chat-messages" class="chat-messages" role="log" aria-live="polite" aria-relevant="additions text"></div>
            <form id="chat-form" class="chat-composer">
              <label class="sr-only" for="chat-input">给中央大脑发消息</label>
              <div id="mention-picker" class="mention-picker" role="listbox" aria-label="选择员工或任务" hidden></div>
              <textarea id="chat-input" name="message" rows="3" maxlength="20000" required
                aria-autocomplete="list" aria-controls="mention-picker" aria-expanded="false"
                placeholder="给中央大脑发消息"></textarea>
              <div id="composer-mentions" class="composer-mentions" aria-label="本条消息的引用"></div>
              <div class="composer-footer">
                <button id="clear-chat" class="button button-quiet" type="button" disabled>清空对话</button>
                <button id="send-chat" class="button button-accent" type="submit" disabled>发送</button>
              </div>
            </form>
          </main>

          <aside class="team-panel" aria-label="数字员工">
            <div class="panel-heading"><h2>数字员工</h2><span id="workforce-summary" class="workforce-summary"></span></div>
            <div id="workers-list" class="worker-list"></div>
          </aside>
        </div>
      </section>

      <section id="view-tasks" class="task-board" aria-label="任务看板" hidden>
        <div class="board-toolbar">
          <div id="task-filters" class="task-filters" role="group" aria-label="按任务状态筛选">
            <button type="button" data-task-filter="all" class="active" aria-pressed="true">全部 <b data-filter-count="all">0</b></button>
            <button type="button" data-task-filter="active" aria-pressed="false">进行中 <b data-filter-count="active">0</b></button>
            <button type="button" data-task-filter="ready" aria-pressed="false">等待开始 <b data-filter-count="ready">0</b></button>
            <button type="button" data-task-filter="attention" aria-pressed="false">需要关注 <b data-filter-count="attention">0</b></button>
            <button type="button" data-task-filter="done" aria-pressed="false">已完成 <b data-filter-count="done">0</b></button>
          </div>
        </div>
        <div id="tasks-list" class="task-list"></div>
      </section>
    </div>
  </div>

  <dialog id="task-dialog" class="task-dialog" aria-labelledby="task-dialog-title">
    <div class="dialog-heading">
      <h2 id="task-dialog-title"></h2>
      <div id="task-dialog-status"></div>
      <button id="close-task-dialog" class="dialog-close" type="button" aria-label="关闭任务详情">×</button>
    </div>
    <div id="task-dialog-content" class="dialog-content"></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js?v=9"></script>
</body>
</html>
